name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Analysis runs end to end on the committed data snapshot
        run: |
          if [ -f data/prices.parquet ]; then python scripts/run_analysis.py; else echo "no data snapshot yet"; fi
