name: Probe data sources
on:
  push:
    branches: [claude/github-projects-improve-nh2reo]
    paths: [scripts/probe_sources.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python scripts/probe_sources.py
